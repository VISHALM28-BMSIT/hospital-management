services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital_dev}
      POSTGRES_USER: ${POSTGRES_USER:-hospital_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "5432:5432"
    volumes:
      - hospital_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital_dev} -d ${POSTGRES_DB:-hospital_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hospital_postgres_data: